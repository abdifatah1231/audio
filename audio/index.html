<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio</title>
  </head>
  <body>
    <h1>Audio controls</h1>
    <button type="button">Play</button>
    <div>
      <span id="volume-label">Volume</span>
      <span id="volume-description">increase the volume or decrease</span>
      <input type="range" min="0" max="100" value="25" aria-labelledby="volume-label volume-description">
    </div>

    <button type="button">Mute</button>
  </body>
</html>
